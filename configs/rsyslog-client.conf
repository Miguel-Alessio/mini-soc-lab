# lab-vuln1: /etc/rsyslog.d/50-soc-forward.conf
# Forwards all local logs (incl. sshd auth) + the Nginx access log to the SIEM node.

module(load="imfile")

input(type="imfile"
      File="/var/log/nginx/access.log"
      Tag="nginx_access:"
      Severity="info"
      Facility="local6")

# single @ = UDP, @@ = TCP. Replace with your SIEM node's IP.
*.* @192.0.2.10:514
