# lab-server: /etc/rsyslog.d/10-remote.conf
# Requires the UDP listener in /etc/rsyslog.conf:
#   module(load="imudp")
#   input(type="imudp" port="514")

# Hardened: only the victim node may write to the central log.
# Anything else arriving from the network is dropped, so a random host on the LAN
# can't inject fake "Failed password" lines and trick the engine into blocking IPs.
if $fromhost-ip == '192.0.2.20' then {
    action(type="omfile" file="/var/log/remote-hosts.log")
    stop
}
if $fromhost-ip != '127.0.0.1' then stop

